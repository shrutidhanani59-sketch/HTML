<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application form</title>
</head>
<body>
    <center>
       <form>
        <h2 align="center">Job Application Form</h2>
        <table border="2" cellpadding="10" bgcolor="skyblue">
            <tr>
                <td><label>Full Name:</label></td>
                <td><input type="text" placeholder="Enter your Name"></td>
            </tr>
            <tr>
                <td> <lable>Email Address:</lable></td>
                <td><input type="email" placeholder="Enter your Email"></td>
            </tr>
            <tr>
                <td> <lable>Phone Number:</lable></td>
                <td><input type="number" placeholder="123-456-7890"></td>
            </tr>
            <tr>
                <td> <lable>Gender:</lable></td>
                <td><input name="g" type="radio">Male
                    <input name="g" type="radio">Female
                </td>
            </tr>
            <tr>
                <td> <label>Job Role:</label></td>
                <td>
                    <select>
                        <option>--select Role--</option>
                        <option>Responsibilities</option>
                        <option>Duties</option>
                        <option>Expectations</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td> <label>Date of Birth:</label></td>
                <td><input type="Date" placeholder="Enter your DOB"></td>
            </tr>
            <tr>
                <td> <label>Favourite color:</label></td>
                <td><input type="color" placeholder="Enter your color"></td>
            </tr>
            <tr>
                <td> <label>Upload Resume:</label></td>
                <td><input type="file" placeholder="Enter your file"></td>
            </tr>
            <tr>
                <td> <label>Skills:</label></td>
                <td><input type="checkbox">HTML
                <input type="checkbox">CSS
                <input type="checkbox">Java Script
                <input type="checkbox">React
                </td>
            </tr>
            <tr>
                <td><label>Cover Letter:</label></td>
                <td>
                    <textarea rows="4" cols="50" placeholder="Writing something about yourself..."></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Submit</button>
                <button type="reset">Reset</button>
                </td>
            </tr>

        </table>
       </form>
    </center>
    
</body>
</html>
