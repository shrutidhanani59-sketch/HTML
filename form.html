<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in html</title>
</head>
<body>
    <center>
        <form>
            <h1 align="center">Form</h1>
            <table border="2" cellpaddind="15" width="500" bgcolor="skyblue" height="450">
                <tr>
                    <td >Name</td>
                    <td><input  required type="text" placeholder="Enter your Name"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input required type="Email" placeholder="Enter your Email"></td>
                </tr>
                <tr>
                    <td>password</td>
                    <td><input required type="password" placeholder="Enter your password"></td>
                </tr>
                <tr>
                    <td>phone number</td>
                    <td><input required type="number" placeholder="Enter your Phone Number"></td>
                </tr>
                <tr>
                    <td>Birth od Data</td>
                    <td><input required type="Date" placeholder="Enter your Date of Birth"></td>
                </tr>
                <tr>
                    <td>Range</td>
                    <td><input required type="Range" min="1" max="4" placeholder="Enter your range"></td>
                </tr>
                <tr>
                    <td>Favourite color</td>
                    <td><input required type="color" placeholder="Enter your range"></td>
                </tr>
                <tr>
                    <td>Aadhar card</td>
                    <td><input required type="file" placeholder="Enter your Aadhar card"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                    <input required name="g" type="radio" >Male
                    <input name="g" type="radio" >FeMale
                    <input name="g" type="radio" >other
                    </td>
                </tr>
                <tr>
                    <td>subject</td>
                    <td>
                    <input required  type="checkbox" >English
                    <input  type="checkbox" >Maths
                    <input  type="checkbox" >Hindi
                    <input  type="checkbox" >science
                    <input  type="checkbox" >Gujarati
                    </td>
                </tr>
                <tr>
                    <td>state</td>
                    <td>
                        <select>
                            <option>Gujarat</option>
                            <option>Goa</option>
                            <option>Maharastra</option>
                            <option>Assam</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Review</td>
                    <td>
                        <textarea required rows="4" cols="50"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <button  type="submit">Submit</button>
                        <button type="Reset">Reset</button>
                    </td>
                </tr>
            </table>
        </form>
    </center>
    
</body>
</html>
